name: Update and deply

on:
    schedule:
        - cron: '17 * * * *'
    workflow_dispatch:
    push:
        paths-ignore:
            - 'data/**'
            - 'public/data/**'

concurrency:
    group: microsoft-status-pages
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    collect-and-build:
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.repository.default_branch }}
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - name: Collect public Microsoft reports
              run: npm run collect
            - name: Commit status data
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add data/archive.json public/data/status.json
                  if ! git diff --cached --quiet; then
                    git commit -m "Update status"
                    git push origin "HEAD:${DEFAULT_BRANCH}"
                  fi
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
            - run: npm run build
            - uses: actions/upload-pages-artifact@v4
              with:
                  path: dist

    deploy:
        needs: collect-and-build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Configure GitHub Pages
              uses: actions/configure-pages@v5
            - name: Deploy GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
